name: Build and Release (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windy-release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build-windows:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      APP_NAME: WindyTranslator
      SPEC_FILE: WindyTranslator.spec
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate release metadata
        run: python scripts/release.py validate

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller (.spec)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean $env:SPEC_FILE
          Copy-Item -Path "tools" -Destination "dist/$env:APP_NAME/tools" -Recurse -Force
          if (-not (Test-Path "dist/$env:APP_NAME/tools")) {
            throw "Expected tools directory beside the executable in the onedir package."
          }
          if (-not (Test-Path "dist/$env:APP_NAME/_internal/modules")) {
            throw "Expected modules directory inside _internal in the onedir package."
          }
          if (-not (Test-Path "dist/$env:APP_NAME/_internal/build-info.json")) {
            throw "Expected build identity for website update checks."
          }

      - name: Zip dist output
        id: zip
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0,7)
          if ($env:GITHUB_EVENT_NAME -ne "pull_request") {
            $zipName = "$env:APP_NAME-windows-nightly.zip"
          } else {
            $zipName = "$env:APP_NAME-windows-sha-$shortSha.zip"
          }
          if (Test-Path $zipName) { Remove-Item -Force $zipName }
          Push-Location "dist"
          Compress-Archive -Path "$env:APP_NAME" -DestinationPath "..\\$zipName" -Force
          Pop-Location
          $packageSize = (Get-Item -LiteralPath $zipName).Length
          if ($packageSize -ge 100000000) {
            throw "Distribution exceeds the 100 MB download limit: $packageSize bytes."
          }
          Write-Host "Distribution size: $packageSize bytes"
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-windows
          path: dist/${{ env.APP_NAME }}
          if-no-files-found: error

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: ${{ steps.zip.outputs.zip_name }}
          if-no-files-found: error

  publish:
    name: Publish Nightly and versioned release
    timeout-minutes: 30
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout pinned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: ${{ runner.temp }}/release-assets

      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py publish \
            --branch main --project WindyTranslator --tag-prefix v \
            --assets "$RUNNER_TEMP/release-assets/WindyTranslator-windows-nightly.zip"
